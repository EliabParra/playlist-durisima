<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SideBar - Demo Simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/global.css" />
  <link rel="stylesheet" href="../src/css/SideBar.css" />
  <script type="module" src="../src/js/lib/Fast.js"></script>
  <script src="https://kit.fontawesome.com/8dd654076b.js" crossorigin="anonymous"></script>
</head>
<body>
  <script type="module">
    import { SideBar } from '../src/js/components/SideBar.js';
    const init = async () => {
      const comp = await fast.createInstance('SideBar', { id: 'MySideBarJS' });
      comp.built = () => console.log('[SideBar] construido (simple)');
      comp.addToBody();
    };
    window.addEventListener('DOMContentLoaded', init);
  </script>

  <side-bar id="MySideBarHTML"></side-bar>
</body>
</html>
