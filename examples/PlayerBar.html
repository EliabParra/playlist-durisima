
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PlayerBar - Demo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../src/css/global.css">
        <link rel="stylesheet" href="../src/css/Swal.css">
        <script type="module" src="../src/js/lib/Fast.js"></script>
        <script src="https://kit.fontawesome.com/8dd654076b.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <h3>Demo PlayerBar</h3>
        <!-- simple video for demo -->
        <div style="max-width:900px;margin:12px auto; display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
            <p style="color:#ccc; font-size:14px; flex:1 1 280px">Demostración de PlayerBar con cola (audio + video). Usa los botones para avanzar y ver el video incrustado dentro del componente.</p>
            <button id="btnAudio" style="padding:8px 14px; background:#1DB954; color:#fff; border:none; border-radius:8px; cursor:pointer;">Cargar Audio</button>
            <button id="btnVideo" style="padding:8px 14px; background:#1DB954; color:#fff; border:none; border-radius:8px; cursor:pointer;">Cargar Video</button>
            <button id="btnNext" style="padding:8px 14px; background:#242424; color:#fff; border:1px solid #2a2a2a; border-radius:8px; cursor:pointer;">Next()</button>
        </div>
        <script type="module">
            import { PlayerBar } from '../src/js/components/PlayerBar.js';
            import { eventBus } from '../src/js/lib/EventBus.js';

            const demoQueue = [
                {
                    id:'track1',
                    src:'../assets/audio/AUTORACEDRAGSTER6091_91.mp3', // Fuente MP3 estable para pruebas
                    type:'audio',
                    title:'SoundHelix 1',
                    artist:'SoundHelix',
                    cover:''
                },
                {
                    id:'track2',
                    src:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
                    type:'video',
                    title:'Flores',
                    artist:'Nature',
                    cover:'https://placehold.co/300x300/121212/1DB954?text=Video'
                }
            ];

            let comp;
            let fastInit = async () => {
                comp = await fast.createInstance("PlayerBar", { 'id':'MyPlayerBarJS' });
                comp.built = ()=>{
                    console.log('PlayerBar listo');
                    comp.setQueue(demoQueue);
                    comp.loadMedia(demoQueue[0]);
                    // No auto play hasta interacción por políticas de autoplay
                };
                comp.addToBody();

                // Log simple de eventos
                eventBus.on('progress', ({currentTime,duration})=>{
                    // console.log('Progress', currentTime.toFixed(1),'/',duration.toFixed(1));
                });
                eventBus.on('track:change', (d)=> console.log('Track change', d.id, d.type));
                eventBus.on('repeat:change', (r)=> console.log('Repeat', r));
                eventBus.on('shuffle:change', (s)=> console.log('Shuffle', s));

                // UI buttons
                document.getElementById('btnAudio').addEventListener('click', ()=> { comp.loadMedia(demoQueue[0]); comp.play(); });
                document.getElementById('btnVideo').addEventListener('click', ()=> comp.loadMedia(demoQueue[1]));
                document.getElementById('btnNext').addEventListener('click', ()=> comp.next());

                // Error logging
                eventBus.on('error', (err)=> console.warn('Media error', err));
            };
            window.addEventListener('DOMContentLoaded', fastInit);
        </script>
    </body>
</html>
