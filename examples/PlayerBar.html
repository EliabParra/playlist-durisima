<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayerBar - Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="stylesheet" href="../src/css/Swal.css">
    <script type="module" src="../src/js/lib/Fast.js"></script>
    <script src="https://kit.fontawesome.com/8dd654076b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h3>Demo PlayerBar</h3>
    <!-- simple video for demo -->
    <div style="max-width:800px;margin:12px auto;">
        <video id="demoVideo" width="800" height="450" controls style="background:#000; width:100%; display:block">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
            Tu navegador no soporta video.
        </video>
    </div>

    <script type="module">
        import { PlayerBar } from '../src/js/components/PlayerBar.js';

        window.addEventListener('DOMContentLoaded', async ()=>{
            // create instance via fast helper (keeps consistency with codebase)
            const comp = await fast.createInstance('PlayerBar', { id: 'MainPlayerBar', mediaSelector: '#demoVideo' });
            // when built, bind media explicitly
            comp.built = ()=>{
                const vid = document.querySelector('#demoVideo');
                if(vid) comp.setMedia(vid);
            }
            comp.addEventListener('player-prev', ()=>console.log('prev requested'));
            comp.addEventListener('player-next', ()=>console.log('next requested'));
            comp.addEventListener('player-shuffle', (e)=>console.log('shuffle', e.detail));
            comp.addEventListener('player-loop', (e)=>console.log('loop', e.detail));
            document.body.appendChild(comp);
        })
    </script>
</body>
</html>
