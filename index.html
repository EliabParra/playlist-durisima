<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Durisima</title>
    <!-- Tipografía Outfit (geométrica, más visible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/Swal.css">
    <script src="https://kit.fontawesome.com/8dd654076b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="app" class="app-shell">
        <aside id="sidebar-container" class="app-sidebar" aria-label="Barra lateral"></aside>
        <header id="searchbar-container" class="app-header" aria-label="Barra de búsqueda"></header>
        <main id="content-container" class="app-content" aria-label="Contenido principal">
            <div class="app-content-placeholder" id="appContentPlaceholder">
                <h2>Bienvenido</h2>
                <p>Selecciona una playlist o usa la búsqueda para comenzar.</p>
            </div>
        </main>
        <div id="playerbar-container" class="app-player" aria-label="Barra del reproductor"></div>
    </div>
    <noscript>Esta aplicación requiere JavaScript habilitado.</noscript>
    <script type="module" src="./src/js/App.js"></script>
</body>
</html>
